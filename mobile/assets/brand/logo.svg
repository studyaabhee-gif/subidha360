<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Subidha360 mark: a home inside a ring that almost closes, read as "360":
       every part of the job, start to finish. Brand blue, marigold accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B6FE0"/>
      <stop offset="1" stop-color="#1257C4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- The ring: 300 degrees of a circle, with an arrow head closing the loop. -->
  <path d="M 512 196 A 316 316 0 1 1 238.3 354" fill="none" stroke="#FFB81C"
        stroke-width="64" stroke-linecap="round"/>
  <path d="M 306 236 L 280 392 L 186 338 Z" fill="#FFB81C" stroke="#FFB81C"
        stroke-width="22" stroke-linejoin="round"/>
  <!-- The home. -->
  <path d="M 512 330 L 704 488 L 704 690 Q 704 706 688 706 L 336 706 Q 320 706 320 690 L 320 488 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="28" stroke-linejoin="round"/>
  <rect x="462" y="560" width="100" height="146" rx="18" fill="#1565D8"/>
</svg>
